[package]
name = "reproit-sdk-engine"
description = "Shared native capture engine for Repro It SDKs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc.workspace = true
reproit-backend.workspace = true
reproit-core.workspace = true
reproit-sdk-rust = { path = "../reproit-sdk-rust" }
reproit-sdk-sentinel = { path = "../reproit-sdk-sentinel", version = "=1.0.0" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "sentinel_native"
path = "tests/sentinel_native.rs"
harness = false
